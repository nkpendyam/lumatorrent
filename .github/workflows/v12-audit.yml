name: V12 Audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  v12-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-package-scripts.mjs
      - run: node scripts/verify-v12-final-scaffold.mjs
      - run: node scripts/audit-v12-package.mjs
      - run: node scripts/v12-gap-report.mjs
