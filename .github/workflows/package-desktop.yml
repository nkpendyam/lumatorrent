name: Package Desktop Dry Run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/engine/**"
      - "apps/native-engine/**"
      - "packages/**"
      - ".github/workflows/package-desktop.yml"

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@stable
      - uses: lukka/get-cmake@latest
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Build native stub
        if: runner.os != 'Windows'
        run: bash scripts/build-native-engine.sh stub
      - name: Build native stub Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-native-engine.ps1 -Mode stub
      - name: Tauri build dry-run
        run: pnpm --filter @lumatorrent/desktop tauri build --debug
