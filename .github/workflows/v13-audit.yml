name: v13-audit

on:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm scripts:check
      - run: pnpm verify:v13
      - run: pnpm audit:v13
      - run: pnpm gap:v13
