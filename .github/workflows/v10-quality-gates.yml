name: v10 Quality Gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - run: node scripts/verify-v10-production-execution.mjs
      - run: node scripts/audit-v10-package.mjs
      - run: node scripts/validate-contracts.mjs
      - run: node scripts/quality-scorecard.mjs
