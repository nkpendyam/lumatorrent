name: Feature request
description: Suggest a legal-use feature
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: policy
    attributes:
      label: Legal-use policy
      options:
        - label: This feature does not add piracy search, scraping, or copyright-infringing indexes.
          required: true
