[package]
name = "lumatorrent-desktop"
version = "0.1.0"
description = "LumaTorrent desktop shell"
authors = ["LumaTorrent Contributors"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "lumatorrent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
