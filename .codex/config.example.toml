# Codex repo-scoped configuration example for LumaTorrent.
# Copy selected settings to ~/.codex/config.toml or project .codex/config.toml after verifying model names in your Codex environment.
# Do not commit private secrets.

# Safe default for this repo.
model = "gpt-5.5"
model_reasoning_effort = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"

# Use official docs and safe search behavior by default.
# Switch to web_search = "live" only when the task needs current official docs or fresh security/release info.

# Keep command environment narrow when possible.
[shell_environment_policy]
include_only = ["PATH", "HOME", "USER", "SHELL", "TMPDIR", "TEMP", "TMP", "PNPM_HOME", "CARGO_HOME", "RUSTUP_HOME"]

# Lightweight profile for scanning and repetitive edits.
# Verify the model name exists in your account/environment before enabling.
[profiles.scan]
model = "gpt-5.4-mini"
model_reasoning_effort = "low"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"

# Default implementation profile.
[profiles.implement]
model = "gpt-5.5"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"

# Debug profile for failing tests/builds.
[profiles.debug]
model = "gpt-5.5"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"

# Review profile. Use after a diff exists.
[profiles.review]
model = "gpt-5.5"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "read-only"
web_search = "cached"

# High-risk full access is intentionally omitted.
# If a task requires extra permissions, request them explicitly for that step only.
